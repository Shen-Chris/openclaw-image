name: Build official-based OpenClaw image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - image-config.json
      - scripts/**
      - tests/**
      - .github/workflows/image.yml
  schedule:
    # 09:23 Asia/Shanghai; best effort, not an exact-time production scheduler.
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'latest or an exact stable version (e.g. 2026.11.4); exact versions do not move candidate'
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: openclaw-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the build recipe only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test recipe and resolver
        run: |
          python3 -m unittest discover -s tests -v
          bash -n scripts/smoke-test.sh

      - name: Resolve official stable browser image and digest
        id: plan
        env:
          REQUESTED_VERSION: ${{ inputs.version || 'latest' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/resolve-image.py \
            --version "$REQUESTED_VERSION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR with the job-scoped token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this source and recipe were already published
        id: existing
        env:
          IMAGE_REF: ${{ steps.plan.outputs.image_ref }}
        run: |
          if docker buildx imagetools inspect "$IMAGE_REF" > /tmp/openclaw-existing.txt 2>/tmp/openclaw-existing.err; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
            echo 'This exact upstream digest and build recipe are already published.'
          else
            # A failed lookup is not proof of absence. Publication below remains
            # authenticated and must succeed before any candidate tag is moved.
            echo 'found=false' >> "$GITHUB_OUTPUT"
            echo 'No readable existing image; build and authenticated publication will be attempted.'
          fi

      - name: Build locally before publishing
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ steps.plan.outputs.platform }}
          build-args: |
            BASE_IMAGE=${{ steps.plan.outputs.base_image }}
          tags: ${{ steps.plan.outputs.image_ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            io.openclaw-image.base.digest=${{ steps.plan.outputs.base_digest }}
            io.openclaw-image.recipe=${{ steps.plan.outputs.recipe_fingerprint }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=openclaw-derived-amd64
          cache-to: type=gha,mode=max,scope=openclaw-derived-amd64

      - name: Smoke test without production state
        if: steps.existing.outputs.found != 'true'
        env:
          IMAGE_REF: ${{ steps.plan.outputs.image_ref }}
          EXPECTED_VERSION: ${{ steps.plan.outputs.version }}
        run: bash scripts/smoke-test.sh "$IMAGE_REF" "$EXPECTED_VERSION"

      - name: Publish the versioned image only after tests pass
        if: steps.existing.outputs.found != 'true'
        env:
          IMAGE_REF: ${{ steps.plan.outputs.image_ref }}
        run: docker push "$IMAGE_REF"

      - name: Update candidate from an automatic latest-stable selection only
        if: steps.plan.outputs.update_candidate == 'true'
        env:
          IMAGE_REF: ${{ steps.plan.outputs.image_ref }}
          CANDIDATE_REF: ${{ steps.plan.outputs.candidate_ref }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag "$CANDIDATE_REF" "$IMAGE_REF"

      - name: Write build summary
        env:
          IMAGE_REF: ${{ steps.plan.outputs.image_ref }}
          BASE_IMAGE: ${{ steps.plan.outputs.base_image }}
          CANDIDATE_REF: ${{ steps.plan.outputs.candidate_ref }}
          UPDATE_CANDIDATE: ${{ steps.plan.outputs.update_candidate }}
          ALREADY_PUBLISHED: ${{ steps.existing.outputs.found }}
        run: |
          {
            echo '## OpenClaw derived image'
            echo "- Official base: \`$BASE_IMAGE\`"
            echo "- Versioned image: \`$IMAGE_REF\`"
            echo "- Previously published: \`$ALREADY_PUBLISHED\`"
            if [ "$UPDATE_CANDIDATE" = true ]; then
              echo "- Candidate: \`$CANDIDATE_REF\`"
            fi
            echo '- No production deployment, server credentials, or state migration was performed.'
            echo '- Smoke tests check the CLI, tools and Chromium executable; they do not validate channels, OAuth, MCP or real browser navigation.'
          } >> "$GITHUB_STEP_SUMMARY"
